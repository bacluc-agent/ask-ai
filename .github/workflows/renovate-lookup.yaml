name: Renovate lookup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract and look up dependencies
        env:
          RENOVATE_GITHUB_COM_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          docker run --rm \
            -e RENOVATE_DRY_RUN=lookup \
            -e RENOVATE_GITHUB_COM_TOKEN \
            -e RENOVATE_LOG_LEVEL=debug \
            -e RENOVATE_ONBOARDING=false \
            -e RENOVATE_PLATFORM=local \
            -e RENOVATE_REPOSITORY_CACHE=reset \
            -e RENOVATE_REQUIRE_CONFIG=ignored \
            -v "$GITHUB_WORKSPACE:/work:ro" \
            -w /work \
            renovate/renovate:41.159.4 | tee renovate-lookup.log
          python - <<'PY'
          from pathlib import Path

          output = Path("renovate-lookup.log").read_text()
          for dependency in ("alpine", "sigoden/aichat", "actions/checkout"):
              assert dependency in output, dependency
          PY
