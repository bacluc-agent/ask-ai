name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      published-tag:
        description: 'Tag of the published image to smoke test anonymously (empty to skip)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate renovate.json
        run: |
          python -c "import json; json.load(open('renovate.json'))"
          python -c "import json; json.load(open('.github/changelog-configuration.json'))"

      - name: Extract and look up Renovate dependencies
        env:
          RENOVATE_GITHUB_COM_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          docker run --rm \
            -e RENOVATE_DRY_RUN=lookup \
            -e RENOVATE_GITHUB_COM_TOKEN \
            -e RENOVATE_LOG_LEVEL=debug \
            -e RENOVATE_ONBOARDING=false \
            -e RENOVATE_PLATFORM=local \
            -e RENOVATE_REPOSITORY_CACHE=reset \
            -e RENOVATE_REQUIRE_CONFIG=ignored \
            -v "$GITHUB_WORKSPACE:/work:ro" \
            -w /work \
            renovate/renovate:41.159.4 | tee renovate-lookup.log
          python - <<'PY'
          import re
          from pathlib import Path

          output = Path("renovate-lookup.log").read_text()
          for dependency in ("alpine", "sigoden/aichat", "actions/checkout"):
              assert dependency in output, dependency
          github_actions = {
              "actions/checkout": 2,
              "mikepenz/release-changelog-builder-action": 1,
              "ncipollo/release-action": 1,
              "docker/login-action": 1,
              "docker/setup-qemu-action": 1,
              "docker/setup-buildx-action": 1,
              "docker/build-push-action": 1,
              "projectsyn/pr-label-tag-action": 1,
          }
          assert output.count('"datasource": "github-tags"') == 9
          for dependency, count in github_actions.items():
              assert output.count(f'"depName": "{dependency}"') == count, dependency
          assert re.search(
              r'"depName": "sigoden/aichat",\s+'
              r'"currentValue": "v[^"\\]+",\s+'
              r'"currentDigest": "[a-f0-9]{64}"',
              output,
          )
          PY

      - name: Build Dockerfile
        run: docker build -t bacluc/ask-ai:test .

      - name: Run aichat --version
        run: docker run --rm bacluc/ask-ai:test --version

      - name: Run under arbitrary numeric UID
        run: docker run --rm --user 12345:12345 bacluc/ask-ai:test --version

  published-image:
    if: ${{ inputs.published-tag != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Run published image anonymously
        run: |
          docker logout ghcr.io || true
          docker run --rm "ghcr.io/bacluc-agent/ask-ai:${{ inputs.published-tag }}" --version
